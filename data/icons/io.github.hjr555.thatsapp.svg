<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bubbleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#30E070"/>
      <stop offset="100%" stop-color="#149E52"/>
    </linearGradient>
    <linearGradient id="hatGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B424A"/>
      <stop offset="100%" stop-color="#1E2226"/>
    </linearGradient>
    <linearGradient id="shadowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Breeze-style green speech bubble -->
  <path d="M32 13C18.2 13 7 23.1 7 35.6c0 4.5 1.5 8.7 4 12.2L8.5 57.5l10.4-2.8c3.8 2 8.3 3.2 13.1 3.2 13.8 0 25-10.1 25-22.3C57 23.1 45.8 13 32 13z"
        fill="url(#bubbleGrad)"/>

  <!-- Subtle bottom rim highlight (Breeze aesthetic) -->
  <path d="M11 47.8l-2.5 9.7 10.4-2.8c3.8 2 8.3 3.2 13.1 3.2 13.8 0 25-10.1 25-22.3 0-.5 0-1-.1-1.5C56.2 45.7 45.3 55.2 32 55.2c-4.8 0-9.3-1.2-13.1-3.2L9.3 54.6z"
        fill="#0F7A3F" fill-opacity="0.28"/>

  <!-- Subtle 45-degree cast shadow from message glyph -->
  <path d="M22 33h20l11 11c-3.5 6.8-10.7 11.7-19.2 12.5L22 44.7z"
        fill="url(#shadowGrad)"/>

  <!-- Minimalist crisp white chat dots inside bubble -->
  <circle cx="22.5" cy="36" r="3.4" fill="#FFFFFF"/>
  <circle cx="32" cy="36" r="3.4" fill="#FFFFFF"/>
  <circle cx="41.5" cy="36" r="3.4" fill="#FFFFFF"/>

  <!-- Minimalist tilted Breeze-charcoal hat perched on top-right crown -->
  <g transform="translate(36, 13) rotate(13)">
    <!-- Hat shadow on bubble -->
    <ellipse cx="0" cy="4.2" rx="16.5" ry="3.2" fill="#0B4F29" fill-opacity="0.28"/>
    <!-- Hat brim -->
    <ellipse cx="0" cy="2.6" rx="16.5" ry="3.1" fill="url(#hatGrad)"/>
    <!-- Hat crown -->
    <path d="M-10.2 2.2L-8.4-6.8c.4-1.8 1.9-3 3.8-2.8 1.5.1 2.9.8 4.6.8s3.1-.7 4.6-.8c1.9-.2 3.4 1 3.8 2.8L10.2 2.2z"
          fill="url(#hatGrad)"/>
    <!-- Accent hat ribbon band -->
    <path d="M-9.6-0.5c3.2.8 6.4 1.1 9.6 1.1s6.4-.3 9.6-1.1l.4 2.1c-3.3.8-6.6 1.2-10 1.2s-6.7-.4-10-1.2z"
          fill="#3DAEE9"/>
  </g>
</svg>
